# Los microservicios NO se construyen aquí: se descargan de Docker Hub.
# Define DOCKERHUB_USER en .env (tu usuario de https://hub.docker.com/).
# Para publicar una versión nueva (hace falta el código fuente):
#   docker login
#   .\push-images.ps1
# Para desarrollar compilando desde el código local:
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Bases de datos: locales y de producción son CONTENEDORES DISTINTOS.
#   Local (lo usan los micros):  mysql / mongodb     → volúmenes mysql_data, mongodb_data
#   Producción (vacía, no la usa la app aún): mysql-prod / mongodb-prod
#     → volúmenes mysql_prod_data, mongodb_prod_data
#   `docker compose down -v` borra AMBOS. No lo uses si quieres conservar pruebas.

networks:
  inklusport-network:
    driver: bridge

# Credenciales MySQL que reciben todos los micros Java. El hostname `mysql`
# es el nombre del servicio en esta red, no localhost.
x-mysql-client: &mysql-client
  SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-}
  MYSQL_USER: ${MYSQL_USER:-root}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}

services:
  # LOCAL: la app apunta aquí. Tiene los usuarios/eventos de prueba.
  mysql:
    image: mysql:8.0
    container_name: inklusport-mysql
    restart: always
    ports:
      # Solo esta máquina. No abrir 3306 al Internet del VPS.
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_ALLOW_EMPTY_PASSWORD: ${MYSQL_ALLOW_EMPTY_PASSWORD:-yes}
      MYSQL_DATABASE: auth_ms
    volumes:
      - ./init-mysql:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    networks:
      - inklusport-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h localhost -u root --password="$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # LOCAL: accessibility + asistente IA apuntan aquí.
  mongodb:
    image: mongo:6.0
    container_name: inklusport-mongodb
    restart: always
    ports:
      # 27018 en el host: el 27017 lo suele ocupar un MongoDB instalado en la
      # máquina. Solo localhost: no publicar Mongo a Internet.
      - "127.0.0.1:27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-accessibility_notifications_db}
    volumes:
      - mongodb_data:/data/db
    networks:
      - inklusport-network
    healthcheck:
      # Lee las credenciales del propio entorno del contenedor para que el
      # healthcheck siga funcionando si se cambia la contraseña en .env.
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.runCommand({ ping: 1 }).ok"',
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # PRODUCCIÓN: schema de init-mysql, sin datos de prueba. Los micros NO
  # se conectan aquí (siguen en mysql/mongodb). Puertos 3307 / 27019 para
  # inspeccionar sin tocar las locales.
  mysql-prod:
    image: mysql:8.0
    container_name: inklusport-mysql-prod
    restart: always
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PROD_PASSWORD:-}
      MYSQL_ALLOW_EMPTY_PASSWORD: ${MYSQL_ALLOW_EMPTY_PASSWORD:-yes}
      MYSQL_DATABASE: auth_ms
    volumes:
      - ./init-mysql:/docker-entrypoint-initdb.d
      - mysql_prod_data:/var/lib/mysql
    networks:
      - inklusport-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h localhost -u root --password="$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  mongodb-prod:
    image: mongo:6.0
    container_name: inklusport-mongodb-prod
    restart: always
    ports:
      - "127.0.0.1:27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-accessibility_notifications_db}
    volumes:
      - mongodb_prod_data:/data/db
    networks:
      - inklusport-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.runCommand({ ping: 1 }).ok"',
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # LLM local, opcional. Sólo arranca con:  docker compose --profile llm-local up -d
  # Se deja fuera del arranque por defecto porque descargar la imagen y el modelo
  # son varios GB; el asistente funciona sin LLM y lo usa si lo encuentra.
  ollama:
    image: ollama/ollama:latest
    container_name: inklusport-ollama
    restart: always
    profiles: ["llm-local"]
    ports:
      - "11434:11434"
    environment:
      # Mantiene el modelo cargado en RAM entre peticiones: sin esto cada consulta
      # al asistente pagaría de nuevo el arranque en frío del modelo.
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - inklusport-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Descarga el modelo una sola vez y termina. El volumen ollama_models lo conserva,
  # así que en arranques posteriores sale de inmediato.
  ollama-init:
    image: ollama/ollama:latest
    container_name: inklusport-ollama-init
    restart: "no"
    profiles: ["llm-local"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c"]
    command: 'ollama pull "$$OLLAMA_MODEL" && ollama list'
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - inklusport-network

  # Los servicios Java ya no llevan el secreto JWT dentro del jar: se pasa por
  # entorno desde .env. La sintaxis :? hace que compose falle con un mensaje claro
  # si la variable no está definida, en vez de arrancar y fallar más tarde.
  auth-service:
    image: ${DOCKERHUB_USER:?define DOCKERHUB_USER en .env}/ink-ms-auth:${IMAGE_TAG:-latest}
    container_name: ink-ms-auth
    restart: always
    ports:
      - "3001:3001"
    environment:
      <<: *mysql-client
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_ms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_URL: jdbc:mysql://mysql:3306/auth_ms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_PROTOCOL: ${MAIL_PROTOCOL:-smtps}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - inklusport-network

  users-service:
    image: ${DOCKERHUB_USER:?define DOCKERHUB_USER en .env}/ink-ms-users:${IMAGE_TAG:-latest}
    container_name: ink-ms-users
    restart: always
    ports:
      - "3002:3002"
    environment:
      <<: *mysql-client
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_ms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_URL: jdbc:mysql://mysql:3306/user_ms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      ACCESSIBILITY_SERVICE_URL: http://accessibility-service:3004
      SPORTS_SERVICE_URL: http://sports-service:3003
      SUBSCRIPTIONS_SERVICE_URL: http://subscriptions-service:3005
      NOTIFICATION_ADMIN_EMAILS: ${NOTIFICATION_ADMIN_EMAILS:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
      accessibility-service:
        condition: service_started
    networks:
      - inklusport-network

  sports-service:
    image: ${DOCKERHUB_USER:?define DOCKERHUB_USER en .env}/ink-ms-sports:${IMAGE_TAG:-latest}
    container_name: ink-ms-sports
    restart: always
    ports:
      - "3003:3003"
    environment:
      <<: *mysql-client
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sports_events_ms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_URL: jdbc:mysql://mysql:3306/sports_events_ms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      ACCESSIBILITY_SERVICE_URL: http://accessibility-service:3004
      USERS_SERVICE_URL: http://users-service:3002
      SUBSCRIPTIONS_SERVICE_URL: http://subscriptions-service:3005
      AI_SERVICE_URL: http://ai-service:3008
      NOTIFICATION_ADMIN_EMAILS: ${NOTIFICATION_ADMIN_EMAILS:-}
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - inklusport-network

  accessibility-service:
    image: ${DOCKERHUB_USER:?define DOCKERHUB_USER en .env}/ink-ms-accessibility:${IMAGE_TAG:-latest}
    container_name: ink-ms-accessibility
    restart: always
    ports:
      - "3004:3004"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      MONGODB_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017/${MONGO_DATABASE:-accessibility_notifications_db}?authSource=admin
      MONGODB_DB: ${MONGO_DATABASE:-accessibility_notifications_db}
      USERS_SERVICE_URL: http://users-service:3002
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_PROTOCOL: ${MAIL_PROTOCOL:-smtps}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
    depends_on:
      mongodb:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - inklusport-network

  reports-service:
    image: ${DOCKERHUB_USER:?define DOCKERHUB_USER en .env}/ink-ms-reports:${IMAGE_TAG:-latest}
    container_name: ink-ms-reports
    restart: always
    ports:
      - "3006:3006"
    environment:
      <<: *mysql-client
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/analytics_ms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_URL: jdbc:mysql://mysql:3306/analytics_ms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - inklusport-network

  subscriptions-service:
    image: ${DOCKERHUB_USER:?define DOCKERHUB_USER en .env}/ink-ms-subscriptions:${IMAGE_TAG:-latest}
    container_name: ink-ms-subscriptions
    restart: always
    ports:
      - "3005:3005"
    environment:
      <<: *mysql-client
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/inklusport_subscriptions?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_URL: jdbc:mysql://mysql:3306/inklusport_subscriptions?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      JPA_DDL_AUTO: none
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      AUTH_SERVICE_URL: http://auth-service:3001
      USERS_SERVICE_URL: http://users-service:3002
      SPORTS_SERVICE_URL: http://sports-service:3003
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      PAYMENT_GATEWAY_MODE: ${PAYMENT_GATEWAY_MODE:-mock}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-${MERCADOPAGO_ACCESS_TOKEN:-}}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY:-${MERCADOPAGO_PUBLIC_KEY:-}}
      MP_CURRENCY: ${MP_CURRENCY:-COP}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-${MERCADOPAGO_WEBHOOK_SECRET:-}}
      MP_NOTIFICATION_URL: ${MP_NOTIFICATION_URL:-${MERCADOPAGO_NOTIFICATION_URL:-https://inklusport.inklusport.uk/api/pagos/mercadopago/webhook}}
      MP_BACK_URL_SUCCESS: ${MP_BACK_URL_SUCCESS:-${MERCADOPAGO_BACK_URL_SUCCESS:-https://inklusport.inklusport.uk/pagos/exito}}
      MP_BACK_URL_PENDING: ${MP_BACK_URL_PENDING:-${MERCADOPAGO_BACK_URL_PENDING:-https://inklusport.inklusport.uk/pagos/pendiente}}
      MP_BACK_URL_FAILURE: ${MP_BACK_URL_FAILURE:-${MERCADOPAGO_BACK_URL_FAILURE:-https://inklusport.inklusport.uk/pagos/error}}
      MERCADOPAGO_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-${MERCADOPAGO_ACCESS_TOKEN:-}}
      MERCADOPAGO_PUBLIC_KEY: ${MP_PUBLIC_KEY:-${MERCADOPAGO_PUBLIC_KEY:-}}
      MERCADOPAGO_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-${MERCADOPAGO_WEBHOOK_SECRET:-}}
      MERCADOPAGO_NOTIFICATION_URL: ${MP_NOTIFICATION_URL:-${MERCADOPAGO_NOTIFICATION_URL:-https://inklusport.inklusport.uk/api/pagos/mercadopago/webhook}}
      MERCADOPAGO_BACK_URL_SUCCESS: ${MP_BACK_URL_SUCCESS:-${MERCADOPAGO_BACK_URL_SUCCESS:-https://inklusport.inklusport.uk/pagos/exito}}
      MERCADOPAGO_BACK_URL_PENDING: ${MP_BACK_URL_PENDING:-${MERCADOPAGO_BACK_URL_PENDING:-https://inklusport.inklusport.uk/pagos/pendiente}}
      MERCADOPAGO_BACK_URL_FAILURE: ${MP_BACK_URL_FAILURE:-${MERCADOPAGO_BACK_URL_FAILURE:-https://inklusport.inklusport.uk/pagos/error}}
      SUBSCRIPTION_WARNING_DAYS: ${SUBSCRIPTION_WARNING_DAYS:-7}
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - inklusport-network

  mcp-service:
    image: ${DOCKERHUB_USER:?define DOCKERHUB_USER en .env}/ink-mcp-inklusport:${IMAGE_TAG:-latest}
    container_name: ink-mcp-inklusport
    restart: always
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      TRANSPORT: streamable-http
      AGENT_ROLE: all
      USERS_SERVICE_URL: http://users-service:3002
      SPORTS_SERVICE_URL: http://sports-service:3003
      REPORTS_SERVICE_URL: http://reports-service:3006
    depends_on:
      users-service:
        condition: service_started
      sports-service:
        condition: service_started
      reports-service:
        condition: service_started
    networks:
      - inklusport-network

  ai-service:
    image: ${DOCKERHUB_USER:?define DOCKERHUB_USER en .env}/ink-ms-ai-assistant:${IMAGE_TAG:-latest}
    container_name: ink-ms-ai-python
    restart: always
    ports:
      - "3008:3008"
    env_file:
      - ./ink-ms-ai-assistant/.env
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017/
      MONGODB_DB: ${AI_MONGODB_DB:-inclusport_training_ia}
      AUTH_SERVICE_URL: http://auth-service:3001
      USERS_SERVICE_URL: http://users-service:3002
      SPORTS_SERVICE_URL: http://sports-service:3003
      ACCESSIBILITY_SERVICE_URL: http://accessibility-service:3004
      REPORTS_SERVICE_URL: http://reports-service:3006
      MCP_ENABLED: "true"
      MCP_URL: http://mcp-service:8000/mcp
      OTEL_SDK_DISABLED: "true"
      CREWAI_DISABLE_TELEMETRY: "true"
      CREWAI_TRACING_ENABLED: "false"
      CHAT_ORQUESTA_CREW: "false"
      LLM_TOOL_CALLING_ENABLED: "false"
      LLM_TEMPERATURE: "0.2"
      LLM_TIMEOUT: "30"
      LLM_MAX_TOKENS: "2048"
      LLM_MAX_CONCURRENT: "2"
      LLM_QUEUE_WAIT_SEGUNDOS: "8"
      LLM_CONTINUACIONES_TRUNCADO: "1"
      CHAT_HISTORIAL_LLM_TURNOS: "3"
      CHAT_HISTORIAL_LLM_CHARS: "700"
      CHAT_MAX_INFLIGHT_PER_USER: "1"
      CHAT_MAX_MENSAJES_POR_HORA: "20"
      CHAT_ESPERA_LIMITE_SEGUNDOS: "3600"
      # El LLM se configura sólo en ink-ms-ai-assistant/.env (cargado arriba con
      # env_file) para no tener la clave y el modelo repartidos en dos sitios.
      # Si activas el perfil llm-local, apunta allí LLM_API_URL a
      # http://ollama:11434/v1/chat/completions, que es el nombre en esta red.
    depends_on:
      mongodb:
        condition: service_healthy
      users-service:
        condition: service_started
      sports-service:
        condition: service_started
      accessibility-service:
        condition: service_started
      reports-service:
        condition: service_started
      mcp-service:
        condition: service_started
    networks:
      - inklusport-network

  gateway-service:
    image: ${DOCKERHUB_USER:?define DOCKERHUB_USER en .env}/ink-ms-gateway:${IMAGE_TAG:-latest}
    container_name: ink-ms-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_SERVICE_URL: http://auth-service:3001
      USERS_SERVICE_URL: http://users-service:3002
      SPORTS_SERVICE_URL: http://sports-service:3003
      ACCESSIBILITY_SERVICE_URL: http://accessibility-service:3004
      REPORTS_SERVICE_URL: http://reports-service:3006
      SUBSCRIPTIONS_SERVICE_URL: http://subscriptions-service:3005
      AI_SERVICE_URL: http://ai-service:3008
    depends_on:
      - auth-service
      - users-service
      - sports-service
      - accessibility-service
      - reports-service
      - subscriptions-service
      - ai-service
    networks:
      - inklusport-network

  # SPA Angular + proxy /api → gateway. El túnel público apunta aquí para
  # que el navegador abra la web y Postman siga usando /api/...
  frontend-service:
    image: ${DOCKERHUB_USER:?define DOCKERHUB_USER en .env}/ink-ms-frontend:${IMAGE_TAG:-latest}
    container_name: ink-ms-frontend
    restart: always
    ports:
      - "8088:80"
    environment:
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    depends_on:
      - gateway-service
    networks:
      - inklusport-network

  # Acceso público: cloudflared → frontend:80 (HTML + /api proxy).
  # En Cloudflare Zero Trust el hostname inklusport.inklusport.uk debe
  # apuntar a http://frontend-service:80 (antes era gateway:8080).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: inklusport-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
    depends_on:
      - frontend-service
    networks:
      - inklusport-network

volumes:
  mysql_data:
  mongodb_data:
  mysql_prod_data:
  mongodb_prod_data:
  ollama_models:
