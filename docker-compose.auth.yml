networks:
  inklusport-network:
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    container_name: inklusport-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: auth_ms
    volumes:
      - ./init-mysql:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    networks:
      - inklusport-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--silent"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  auth-service:
    build:
      context: ./ink-ms-auth
      dockerfile: Dockerfile
    container_name: ink-ms-auth
    ports:
      - "3001:3001"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - inklusport-network

volumes:
  mysql_data:
